kind = "web"
previewPath = "/tessiu-demo/"
title = "TESSIU Demo Web"
description = "Versione web demo dell'app TESSIU. Replica fedelmente tutte le schermate dell'app mobile (Utente e Attività) in un frame telefono, con dati mock identici all'app Expo. Scopo: condividere con investitori/clienti via link senza installare nulla."
version = "1.0.0"
id = "artifacts/tessiu-demo"
router = "path"

[[services]]
name = "web"
paths = [ "/tessiu-demo/" ]
localPort = 25117

[services.development]
run = "pnpm --filter @workspace/tessiu-demo run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/tessiu-demo", "run", "build" ]
serve = "static"
publicDir = "artifacts/tessiu-demo/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "25117"
BASE_PATH = "/tessiu-demo/"
